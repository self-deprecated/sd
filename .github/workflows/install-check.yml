name: Install check

# Installs the published release the way users do and runs a task.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install self-deprecated/tap/sd
      - run: sd --version
      # Runs the formula's own test: --version plus a demo task.
      - run: brew test self-deprecated/tap/sd
      - run: brew audit --strict self-deprecated/tap/sd

  scoop:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: MinoruSekine/setup-scoop@v5
      - shell: pwsh
        run: |
          scoop bucket add self-deprecated https://github.com/self-deprecated/scoop-bucket
          scoop install self-deprecated/sd
          sd --version
      - name: Run a task
        shell: pwsh
        run: |
          $demo = Join-Path $env:RUNNER_TEMP demo
          New-Item -ItemType Directory -Force (Join-Path $demo .sd) | Out-Null
          "version: 1`nproject: {id: demo, dir: .}`ntasks:`n  hello: {run: printf hello}`n" | Set-Content (Join-Path $demo .sd/tasks.yaml)
          Set-Location $demo
          $out = sd hello
          if ($out -ne 'hello') { throw "unexpected output: $out" }
