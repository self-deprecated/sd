version: 2

project_name: sd

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && for shell in bash zsh fish powershell; do go run ./cmd/sd completion "$shell" > "completions/sd.$shell"; done'

builds:
  - id: sd
    main: ./cmd/sd
    binary: sd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/self-deprecated/sd/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: self-deprecated
    name: sd
  prerelease: auto

homebrew_casks:
  - name: sd
    repository:
      owner: self-deprecated
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/self-deprecated/sd
    description: Project task dispatcher for .sd/tasks.yaml manifests
    binaries: [sd]
    completions:
      bash: completions/sd.bash
      zsh: completions/sd.zsh
      fish: completions/sd.fish
    hooks:
      post:
        # The binaries are not notarized; drop the quarantine flag so macOS
        # runs them.
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sd"]
          end

scoops:
  - name: sd
    repository:
      owner: self-deprecated
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/self-deprecated/sd
    description: Project task dispatcher for .sd/tasks.yaml manifests
    license: MIT
