version: 2

project_name: sd

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && for shell in bash zsh fish powershell; do go run ./cmd/sd completion "$shell" > "completions/sd.$shell"; done'

builds:
  - id: sd
    main: ./cmd/sd
    binary: sd
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/self-deprecated/sd/internal/cli.Version={{ .Version }}

# Signs and notarizes the macOS binaries with the Developer ID Application
# certificate once its secrets are set; until then they ship unsigned.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [sd]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: self-deprecated
    name: sd
  prerelease: auto

scoops:
  - name: sd
    repository:
      owner: self-deprecated
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/self-deprecated/sd
    description: Project task dispatcher for .sd/tasks.yaml manifests
    license: MIT
